name: Deploy (AWS)

# Ships main to AWS (ADR 0003, infra/README.md).
#
#   images  Builds the backend and frontend images for linux/arm64 and pushes them to GHCR as
#           ghcr.io/<owner>/3t-backend:<sha> and ghcr.io/<owner>/3t-frontend:<sha>, plus :main.
#   deploy  Signs in to AWS with GitHub OIDC, updates the CloudFormation stack (infra/app.yaml)
#           to those image tags, and smoke-checks the app through CloudFront
#           (infra/smoke-check.sh). Skipped until the variable AWS_DEPLOY_ROLE_ARN is set.
#
# It runs after CI succeeds on a push to main (the release gate, charter §6), or by hand from
# the Actions tab.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in order. A queued one is not cancelled: each is a released commit.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  images:
    name: Build and push ${{ matrix.image }} image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    # Native arm64 runner: production runs on Graviton, and no QEMU emulation is needed.
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        image: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run checks out the default branch head; deploy exactly what CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Image name
        id: tags
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/3t-${IMAGE}"
          echo "image=${repo}:${SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${repo}:main" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ matrix.image }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}
            ${{ steps.tags.outputs.latest }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to AWS
    needs: images
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    environment: production
    # A ScaleMode switch or a new host takes ~15 min; a normal deploy ~5 min.
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      STACK: 3t-run
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # Only the image tags change. Every other parameter keeps its current value. CloudFormation
      # waits until ECS reports the new tasks running, and rolls the stack back if they fail.
      - name: Update the stack
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          aws cloudformation deploy \
            --stack-name "$STACK" \
            --template-file infra/app.yaml \
            --role-arn "$EXEC_ROLE_ARN" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "BackendImage=ghcr.io/${owner}/3t-backend:${SHA}" \
              "FrontendImage=ghcr.io/${owner}/3t-frontend:${SHA}"
        env:
          EXEC_ROLE_ARN: ${{ vars.AWS_CFN_EXEC_ROLE_ARN }}
      - name: Smoke check
        run: |
          url=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='AppUrl'].OutputValue" --output text)
          bash infra/smoke-check.sh "$url"
          echo "### Deployed ${SHA::7} to ${url}" >> "$GITHUB_STEP_SUMMARY"
