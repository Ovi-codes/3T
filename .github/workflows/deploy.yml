name: Deploy (Azure)

# ─────────────────────────────────────────────────────────────────────────────
# DISABLED / MANUAL-ONLY until Azure is provisioned (Task 8, the human portion).
#
# This workflow never runs on push or merge. It only runs when triggered by hand
# from the Actions tab (workflow_dispatch). Right now it is a skeleton: the secrets
# and variables it references do not exist yet, so do not trigger it until the
# Azure resources below are created.
#
# TO STAND IT UP (Task 8 checklist, human):
#   1. Create, in an EU region (North/West Europe):
#        - a resource group
#        - an App Service (Linux, Java 21) for the backend
#        - a Static Web App for the frontend
#        - an Azure Database for PostgreSQL Flexible Server (Burstable / free-eligible)
#   2. Add these GitHub repository secrets:
#        - AZURE_WEBAPP_PUBLISH_PROFILE        (App Service > Get publish profile)
#        - AZURE_STATIC_WEB_APPS_API_TOKEN     (Static Web App > deployment token)
#      and this repository variable:
#        - AZURE_WEBAPP_NAME                   (the App Service name)
#   3. On the App Service, set application settings so the app reaches Azure Postgres
#      (Flyway then migrates on startup and /api/ping reads the version from it):
#        DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD   (or a full DB connection string)
#   4. Configure how the Static Web App forwards /api/* to the backend App Service
#      (a staticwebapp.config.json route, or a linked backend) so the SPA's relative
#      /api/ping call reaches Spring Boot in production.
#
# TO ENABLE AUTO-DEPLOY (gated on green CI on main):
#   Replace the `on:` block with the commented `workflow_run` version below, and
#   uncomment the `if:` success guard on each job. That makes deploy run only after
#   the CI workflow succeeds on main — the release gate the charter describes.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
  # Enable after Task 8 to auto-deploy once CI is green on main:
  # workflow_run:
  #   workflows: [CI]
  #   types: [completed]
  #   branches: [main]

permissions:
  contents: read

jobs:
  deploy-backend:
    name: Deploy backend to App Service
    runs-on: ubuntu-latest
    environment: production
    # if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build jar
        working-directory: backend
        run: ./mvnw -B -DskipTests package
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend/target/*.jar

  deploy-frontend:
    name: Deploy frontend to Static Web Apps
    runs-on: ubuntu-latest
    environment: production
    # if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist/threet-run/browser
          skip_app_build: true