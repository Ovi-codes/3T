name: Deploy (AWS)

# Ships main to AWS (ADR 0003, infra/README.md).
#
#   images  Builds the backend and frontend images for linux/arm64 and pushes them to GHCR as
#           ghcr.io/<owner>/3t-backend:<sha> and ghcr.io/<owner>/3t-frontend:<sha>, plus :main.
#
# The AWS deploy job (CloudFormation via GitHub OIDC, then a smoke check through CloudFront)
# comes with the infrastructure in the next step of #98. Until then, this workflow only
# publishes the images.
#
# It runs after CI succeeds on a push to main (the release gate, charter §6), or by hand from
# the Actions tab.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in order. A queued one is not cancelled: each is a released commit.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  images:
    name: Build and push ${{ matrix.image }} image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    # Native arm64 runner: production runs on Graviton, and no QEMU emulation is needed.
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        image: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run checks out the default branch head; deploy exactly what CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Image name
        id: tags
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/3t-${IMAGE}"
          echo "image=${repo}:${SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${repo}:main" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ matrix.image }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}
            ${{ steps.tags.outputs.latest }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
