name: CI

# The seed of the release gate. All three jobs must pass; the CS-1..6 core-scenario
# E2E tests (charter §5) plug into the e2e job as they are built.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # verify = format check (Spring Java Format, validate phase) + unit tests + Testcontainers
      # integration + JaCoCo report. Docker is present on the runner, so the throwaway Postgres
      # spins up with no extra setup.
      - name: mvn verify
        working-directory: backend
        run: ./mvnw -B verify
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('backend/target/site/jacoco/jacoco.csv') != '' }}
        run: node .github/scripts/coverage-summary.mjs backend backend/target/site/jacoco/jacoco.csv backend-coverage.json
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('backend/target/site/jacoco/jacoco.csv') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          retention-days: 7
      - name: Upload coverage badge
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-badge
          path: backend-coverage.json
          retention-days: 1

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Format check
        working-directory: frontend
        run: npm run format:check
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests + coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('frontend/coverage/threet-run/coverage-summary.json') != '' }}
        run: node .github/scripts/coverage-summary.mjs frontend frontend/coverage/threet-run/coverage-summary.json frontend-coverage.json
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('frontend/coverage/threet-run/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/threet-run/
          retention-days: 7
      - name: Upload coverage badge
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-badge
          path: frontend-coverage.json
          retention-days: 1

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # spring-boot:run (started by Playwright's webServer) needs a real Postgres, and the CS-1 test
    # needs a real SMTP server to read the confirmation email back from. Testcontainers is not used
    # here, so provide both as services with the same defaults as docker-compose.yml.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: runro
          POSTGRES_USER: runro
          POSTGRES_PASSWORD: runro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runro -d runro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Mailpit receives the confirmation email on :1025; the E2E reads it back over :8025.
      mailpit:
        image: axllent/mailpit:v1.30.7
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install E2E deps
        working-directory: e2e
        run: npm ci
      - name: Format check (E2E)
        working-directory: e2e
        run: npm run format:check
      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # Build both apps up front: the backend package also compiles + warms the Maven cache so
      # the spring-boot:run inside webServer starts within budget, and the frontend production
      # build is a real gate (AOT + bundle budgets) that the dev server would not catch.
      - name: Build backend
        working-directory: backend
        run: ./mvnw -B -DskipTests package
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Playwright's webServer starts the backend (spring-boot:run) and frontend (npm start),
      # waits for both, runs the suite on desktop + mobile, then tears them down.
      - name: Run E2E
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # On main only: publish the coverage badge JSON to the `badges` branch, which the README's
  # shields.io endpoint badges read. Kept off main itself so CI never commits to the protected branch.
  coverage-badges:
    name: Publish coverage badges
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: '*-coverage-badge'
          merge-multiple: true
          path: badges
      - name: Push to the badges branch
        working-directory: badges
        run: |
          git init -q -b badges
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -q -m "Coverage badges for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges
