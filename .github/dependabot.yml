version: 2

# Weekly update PRs. Minor + patch bumps are grouped per ecosystem to keep the PR count low;
# majors still arrive one per PR so each can be reviewed on its own (except Angular and Vitest, see below).
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      # Angular packages must move together, majors included: their peer ranges are exact,
      # so a single-package major bump can't install.
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint']
        update-types: [major, minor, patch]
      # Same for Vitest: @vitest/coverage-v8 peers on the exact vitest version.
      vitest:
        patterns: ['vitest', '@vitest/*']
        update-types: [major, minor, patch]
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Each Angular release pins a narrow TypeScript peer range (Angular 22: >=6.0 <6.1), so a
      # standalone TypeScript major or minor can't install. Bump it by hand with Angular.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      e2e-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Base images in the root Dockerfile (node, eclipse-temurin).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
