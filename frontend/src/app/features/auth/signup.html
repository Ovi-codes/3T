<main class="page">
  <header class="page-header">
    <p class="eyebrow">Accounts</p>
    <h1>Create your account</h1>
    <p class="lede">Track your upcoming and past runs. It takes a moment.</p>
  </header>

  <hr class="course-rule" aria-hidden="true" />

  @if (formError(); as message) {
    <p class="state-error" role="alert">{{ message }}</p>
  }

  <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        [attr.aria-invalid]="controlError('email') ? 'true' : null"
        [attr.aria-describedby]="controlError('email') ? 'email-error' : null"
      />
      @if (controlError('email'); as message) {
        <p class="field-error" id="email-error">{{ message }}</p>
      }
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="new-password"
        [attr.aria-invalid]="controlError('password') ? 'true' : null"
        [attr.aria-describedby]="controlError('password') ? 'password-error' : null"
      />
      @if (controlError('password'); as message) {
        <p class="field-error" id="password-error">{{ message }}</p>
      }
    </div>

    <button class="button" type="submit" [disabled]="submitting()" data-testid="signup-submit">
      {{ submitting() ? 'Creating account…' : 'Create account' }}
    </button>
  </form>

  <p class="switch">Already have an account? <a routerLink="/login">Sign in</a>.</p>
</main>
