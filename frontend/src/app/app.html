<!-- Bypass blocks (WCAG 2.4.1): lets keyboard users jump the header straight to the page's main
     content. Visually hidden until focused, then it appears as a real, styled control. -->
<a class="skip-link" href="#main-content">Skip to content</a>

<header class="app-header">
  <nav class="app-header-inner" aria-label="Primary">
    <a class="brand" routerLink="/">3T Run</a>

    <!-- One auth action; hidden until the session check settles, so it never shows the wrong one. -->
    @if (user(); as account) {
      <a class="nav-button" routerLink="/dashboard" data-testid="nav-dashboard">My dashboard</a>
    } @else if (user() === null) {
      <a class="nav-button" routerLink="/login" data-testid="nav-login">Log in</a>
    }
  </nav>
</header>

<router-outlet></router-outlet>

<footer class="app-footer">
  <div class="app-footer-inner">
    <p class="app-footer-copy">3T Run — weekly free 5k events in Romania.</p>
    <nav aria-label="Footer">
      <a routerLink="/privacy" data-testid="footer-privacy">Privacy policy</a>
    </nav>
  </div>
</footer>
