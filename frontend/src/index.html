<html lang="en">
<head>

  <!-- The favicon carries the "3T" mark, so the tab title reads "RUN" — together: 3T RUN. -->
  <title>RUN</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Orange "3T" mark. Single scalable SVG icon; sizes="any" makes Chromium prefer it. -->
  <link rel="icon" type="image/svg+xml" sizes="any" href="favicon.svg">
  <!-- Font: Archivo (400/600/800). Google serves the Latin-Extended subset so Romanian
       diacritics (ă â î ș ț) render. Archivo is the "Floodlight" theme's only family. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap"
    rel="stylesheet">
</head>
