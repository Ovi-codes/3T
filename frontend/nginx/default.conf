# Serves the Angular build (ADR 0003). CloudFront (or the ALB, in ScaleMode=fargate) routes
# /api/* and /actuator/* to the backend, so those paths should never reach this server.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Health check for the ALB target group and the CI smoke check.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # These paths belong to the backend. If one gets here, the routing is wrong. Answer 404,
    # never the SPA shell, so the mistake is visible.
    location ~ ^/(api|actuator)(/|$) {
        return 404;
    }

    # Hashed build output (main-ABCD1234.js, chunk-*.js, styles-*.css, media/*). A new build
    # gives a new name, so the browser and CloudFront can keep these forever. Case-sensitive on
    # purpose: Angular hashes are upper-case, and public/ files like sunset-runners.png are not.
    location ~ "-[A-Z0-9]{8}\.[a-z0-9]+$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Any other path with a file extension is a file: serve it, or 404. A stale chunk name from
    # an older deploy must not get index.html back, or the browser parses HTML as JavaScript.
    location ~ \.[^/]+$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Everything else is an Angular route (/dashboard, /register/42): serve the shell, so a
    # page reload works. no-cache makes the browser check it on each load (a cheap 304), so a
    # cached shell never points at chunks that a new deploy removed.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
