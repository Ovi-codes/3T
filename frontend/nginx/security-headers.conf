# The headers Spring Security added when the backend served the SPA. They are included in each
# location, because a location with its own add_header does not inherit the server-level ones.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# Browsers ignore this over plain http (local runs). Production is HTTPS only (CloudFront).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
