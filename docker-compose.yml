services:
  postgres:
    image: postgres:16
    container_name: 3t-postgres
    environment:
      POSTGRES_DB: runro
      POSTGRES_USER: runro
      POSTGRES_PASSWORD: runro
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runro -d runro"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Unused until Increment 2 (confirmation email), wired now so the seam exists.
  mailpit:
    image: axllent/mailpit:v1.30.7
    container_name: 3t-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
