spring:
  application:
    name: 3t-run-backend

  # Defaults match docker-compose.yml, so a local run needs no environment at all.
  # Every value is overridable for CI and for Azure.
  datasource:
    # DB_SSLMODE: Azure Postgres only accepts TLS, so the deploy sets "require".
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:runro}?sslmode=${DB_SSLMODE:prefer}
    username: ${DB_USER:runro}
    password: ${DB_PASSWORD:runro}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    # Flyway owns the schema; Hibernate only checks the mapping still matches it.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # Confirmation email. Defaults match the Mailpit service in docker-compose.yml; a prod
  # provider sets host/port/credentials via env. Mailpit accepts any (or no) auth, so auth
  # and STARTTLS are off by default and switched on for a real SMTP host through env.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}
  # In Azure, TLS ends at the Container Apps ingress, which forwards plain http with
  # X-Forwarded-Proto. Trusting it makes request.isSecure() true there, so the CSRF cookie
  # gets the Secure flag and redirects keep https.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        # The account session cookie. httpOnly keeps it out of JavaScript; SameSite=Lax blocks the
        # cross-site POST that CSRF tokens would otherwise guard (see SecurityConfig). Secure is on
        # by default so prod always sends it over TLS; local http and the E2E run opt out by setting
        # SESSION_COOKIE_SECURE=false (a Secure cookie is never stored over http, so login wouldn't
        # stick).
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}

# Actuator: the readiness probe. Expose only the health endpoint (E2E and the deploy smoke
# check hit /actuator/health); its "db" indicator reports UP only once Postgres is reachable.
# /actuator/health/liveness reports only the process itself: Container Apps restarts the
# container on that one, so a Postgres blip doesn't cause a restart loop.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # SMTP is not part of health. If the mail provider is down, browsing and signing in
    # still work (a registration then fails with its own error), so the app stays up.
    mail:
      enabled: false

# Application settings not owned by a Spring namespace.
app:
  # Comma-separated emails granted ROLE_ADMIN lazily on sign-up/login (issue #57). Empty by default,
  # so a deploy has no admins until the var is set
  admin:
    emails: ${ADMIN_EMAILS:}
  # Seed a past run with ranked runners and a demo account (demo@example.com / demo-run-5k) so the
  # leaderboard can be demoed without typing data in (#44). Off by default — never set it in prod.
  demo-data: ${DEMO_DATA:false}
  mail:
    # The From address on confirmation emails. Overridden per environment.
    from: ${MAIL_FROM:no-reply@3trun.ro}
  weather:
    # Open-Meteo forecast endpoint (free, no API key, EU-hosted).
    api-url: ${WEATHER_API_URL:https://api.open-meteo.com/v1/forecast}
    # How far ahead a forecast is fetched. Cap at 8 days for accuracy.
    forecast-horizon-days: ${WEATHER_FORECAST_HORIZON_DAYS:8}
    # Server-side forecast cache TTL. ISO-8601 duration.
    cache-ttl: ${WEATHER_CACHE_TTL:PT1H}